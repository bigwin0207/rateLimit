spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL # H2 메모리 DB (MySQL 모드)
    driver-class-name: org.h2.Driver
    username: sa
    password:
server:
  port: 8081

  jpa:
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 테이블 자동 생성/수정
    show-sql: true     # 실행되는 SQL 쿼리 콘솔 출력
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true    # H2 웹 콘솔 활성화 (http://localhost:8081/h2-console 접속 가능)